<div id="game-container">
    <div class="page-content">
        <header class="page-header">
            <button
                hx-post="/reset"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="button button-secondary text-sm">
                ← Back
            </button>
            <div class="text-center">
                <p class="page-subtitle">Social Bingo</p>
                <h1 class="page-title">Soc Ops</h1>
            </div>
            <div class="w-16"></div>
        </header>

        <div class="panel">
            Tap a square when you find someone who matches it.
        </div>

        {% if session.has_bingo %}
        <div class="toast">
            🎉 BINGO! You got a line!
        </div>
        {% endif %}

        <div class="board-shell">
            {% include "components/bingo_board.html" %}
        </div>
    </div>

    {% if session.show_bingo_modal %}
        {% include "components/bingo_modal.html" %}
    {% endif %}
</div>
